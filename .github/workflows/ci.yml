name: Strip CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -r core/requirements.txt pyinstaller

      - name: Install Electron dependencies
        working-directory: desktop
        run: npm ci

      - name: Validate workflow configuration
        run: python .github/scripts/verify_workflow_config.py

      - name: Generate release assets
        run: python scripts/generate_release_assets.py

      - name: Verify release assets
        run: python scripts/verify_release_assets.py

      - name: Run core CLI tests
        working-directory: core
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Run desktop tests
        working-directory: desktop
        run: npm test

      - name: Build Electron bundles
        working-directory: desktop
        run: npm run build

      - name: Build CLI smoke artifact
        run: python build_cli.py
