<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      img-src now allows strip-file: (the custom protocol serving local
      covers/chapter pages — see main/index.js) instead of the plain
      file: it used to list. Plain file: never actually worked here: a
      page loaded over http:// (Vite's dev server) is blocked by
      Chromium from loading file:// resources regardless of what CSP
      permits — that restriction sits below CSP, at the origin level.
      strip-file: isn't subject to that rule, which is the whole point
      of registering it.

      script-src's 'unsafe-eval' and connect-src's localhost entries are
      still for Vite's dev server (React Fast Refresh + HMR websocket).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' strip-file: data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-eval'; connect-src 'self' ws://localhost:* http://localhost:*"
    />
    <title>Strip</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap"
      rel="stylesheet"
    />
  </head>
  <body data-theme="light">
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
